[project]
name = "deskhand"
version = "0.1.0"
description = "A hand for desktop agents: fuse macOS Accessibility + Vision OCR into one aimable view, then execute."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["computer-use", "desktop-agent", "accessibility", "macos", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
macos = [
  "pyobjc-framework-ApplicationServices>=11",
  "pyobjc-framework-Cocoa>=11",
  "pyobjc-framework-Quartz>=11",
  "pyobjc-framework-ScreenCaptureKit>=11",
  "pyobjc-framework-Vision>=11",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6",
  "ruff>=0.14,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
deskhand = "deskhand.cli:main"

[project.urls]
Homepage = "https://github.com/kadaliao/deskhand"
Issues = "https://github.com/kadaliao/deskhand/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskhand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "ARG", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "PLR2004", "ARG001", "ARG002", "ARG005", "SIM117", "PLC0415"]
# Subcommands and framework access are imported lazily on purpose: importing the
# macOS package must not import pyobjc, so it stays importable and testable off a Mac.
"src/deskhand/cli.py" = ["PLC0415"]
"src/deskhand/sensors/macos/*" = ["PLC0415"]
"src/deskhand/console/desk.py" = ["PLC0415"]
"src/deskhand/protocols.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "ApplicationServices.*", "AppKit.*", "Quartz.*", "Vision.*", "objc.*", "Foundation.*",
  "ScreenCaptureKit.*",
]
ignore_missing_imports = true
